openapi: 3.0.3
info:
  title: Broomees Relationship, Reputation & Access-Control API
  version: 1.0.0
  description: Secure Laravel API for users, mutual relationships, hobbies, reputation, and token-scoped rate limiting.
servers:
  - url: https://broomees-api.onrender.com
paths:
  /api/health:
    get:
      summary: Health check
      responses:
        '200': { description: Application is healthy }
  /api/auth/token:
    post:
      summary: Issue an expiring bearer token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenRequest' }
      responses:
        '201': { description: Token issued, content: { application/json: { schema: { $ref: '#/components/schemas/Success' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/users:
    get:
      summary: List users with pagination and optional username search
      security: [ { BearerToken: [] } ]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: search, in: query, schema: { type: string } }
      responses:
        '200': { description: Paginated users }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      summary: Register a user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreateRequest' }
      responses:
        '201': { description: User created }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/users/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Get a user with friends and hobbies
      security: [ { BearerToken: [] } ]
      responses:
        '200': { description: User details }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    put:
      summary: Update a user using optimistic locking
      security: [ { BearerToken: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdateRequest' }
      responses:
        '200': { description: User updated }
        '400': { $ref: '#/components/responses/BadRequest' }
